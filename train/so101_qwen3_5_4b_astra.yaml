# SO-101 × Show-Harness：GPT-6 Astra の動作トークンを Qwen3.5-4B（LoRA）に蒸留する。
# データは DM0.5 near_mix57 と同じ 57 話（指示の付け替え込み、2,397 判断）。VLA と VLM を同じデモで比べる。
# so101_qwen3_5_2b.yaml から変えたのは model / dataset / 出力先 / エポック数 / run 名のみ（学習率・LoRA・実効バッチ 32 は公式のまま）。
#   CONFIG=train/so101_qwen3_5_4b_astra.yaml WANDB_PROJECT=so101-showharness bash scripts/train/train.sh
#   CONFIG=train/so101_qwen3_5_2b.yaml WANDB_PROJECT=so101-showharness bash scripts/train/train.sh
# mvtoken LoRA - Qwen3.5-2B on the released Show-Harness sim split (RoboLab 130 eps +
# ManiSkill 100 eps, mixed; both simulators share the 2 cm translation quantum, so they
# train together without rescaling). Hyperparameters are the template's, unchanged.
#   SPLITS=sim bash train/scripts/download_dataset.sh
#   CONFIG=train/configs/qwen3_5_2b_sim.yaml GPU=0 bash train/scripts/train.sh

### model
model_name_or_path: Qwen/Qwen3.5-4B    # local weights: pass MODEL_PATH=/path/to/weights
image_max_pixels: 65536    # 256x256, matches the stored rollout resolution
trust_remote_code: true
flash_attn: fa2

### method
stage: sft
do_train: true
finetuning_type: lora
freeze_vision_tower: true            # language side only
freeze_multi_modal_projector: false

### LoRA
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target: all

### dataset
# the name used by register_dataset.py (see LF's data/dataset_info.json)
dataset: so101_vials_astra_near_mix57
template: qwen3_5_nothink
cutoff_len: 2048
overwrite_cache: true      # LF's fingerprint only hashes path strings, so overwritten images go unnoticed
preprocessing_num_workers: 4
dataloader_num_workers: 2

### output
output_dir: /home/ubuntu/so101-showharness/outputs/train/qwen3_5_4b_astra_near_mix57
logging_steps: 2
save_strategy: epoch           # エポックごとに保存（sim 評価で比較する）
save_total_limit: 10
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb
# wandb project/entity come from WANDB_PROJECT / WANDB_ENTITY, passed by train.sh.
# Upstream has no wandb_entity yaml key, and `project` here is transformers' Trackio
# field, not the wandb project.
run_name: so101-qwen3.5-4b-astra-near-mix57

### train
# 1 GPU: batch 4 x grad_acc 8 = eff_bs 32, the same effective batch and lr curve as the
# template's 2-GPU 4 x 4 x 2.
per_device_train_batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 10.0         # 57 話・1 エポック 75 ステップ。エポックごとに保存し、sim で伸び方を見る
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### distributed (ZeRO-2: 2B in bf16 is ~4GB, fits on one GPU; less comm than ZeRO-3)
# deepspeed: examples/deepspeed/ds_z2_config.json
