# Workshop v1.0 sim backend (src/so101_showharness/sim/workshop_backend.py)
task: Lerobot-So101-Teleop-Vials-To-Rack-DR
env_step_hz: 60                 # physics 120 Hz x decimation 2
env_steps_per_ctrl: 2           # one control step = 30 Hz
record_hz: 30
episode_length_s: 3600          # no time-out; success read from subtask_terms.vial_placed

ik:
  joints: [Rotation, Pitch, Elbow, Wrist_Pitch]   # Wrist_Roll held, Jaw = gripper
  hold: tool_pitch                                # 5-DoF: position + tool pitch only
  pitch_weight_m_per_rad: 0.05
  tcp_offset_in_gripper_link: [-0.0079, -0.000218, -0.0981]   # lerobot so101 URDF gripper_frame_joint
  gravity_bias: {enabled: true, rest_tol_rad: 0.002, alpha: 0.5}

atomic_exec:
  step_m: 0.02
  max_cmd_m: 0.02
  max_ctrl_steps: 24

cameras:   # Show-Harness view contract (images fed to the VLM)
  agentview: {source: external_D455, rotation_degrees: 0, flip: null, square_size: 256}
  wrist:     {source: ego,           rotation_degrees: 0, flip: null, square_size: 256}
  # The LeRobot/VLA side keeps the raw 640x480 frames untouched.
